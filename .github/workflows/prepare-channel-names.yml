name: Preparar nombres del catálogo para el PR

on:
  push:
    branches: [feat/video-channel-display-name]
    paths: [.github/workflows/prepare-channel-names.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'andrescassanaz/zp-static-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Probar y validar sin secretos
        run: |
          python -m unittest discover -s tests -v
          python scripts/sync.py --mode validate
      - name: Completar sólo nombres con la API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/sync.py --mode names
      - name: Conservar catálogo preparado para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-names-${{ github.sha }}
          path: |
            channels/
            sync-state.json
          if-no-files-found: error
          retention-days: 2
