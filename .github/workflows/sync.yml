name: Sincronizar canales

on:
  schedule:
    # UTC: daily a las 06:17 de Argentina; weekly y mantenimiento el domingo 07:47.
    - cron: '17 9 * * *'
    - cron: '47 10 * * 0'
  push:
    branches: [main]
    paths:
      - sources.json
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de sincronización
        type: choice
        options: [update, maintenance]
        default: update
      channel:
        description: ID de canal (vacío procesa todos)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: youtube-assets-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/play-compliance-minimal'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Pruebas sin API ni secretos
        run: python -m unittest discover -s tests -v
      - name: Validar configuración y listas
        run: python scripts/sync.py --mode validate
      - name: Sincronizar
        id: sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REQUESTED_MODE: ${{ inputs.mode }}
          CHANNEL_ID: ${{ inputs.channel }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          mode="${REQUESTED_MODE:-update}"
          args=(--mode "$mode")
          if [[ "$EVENT_NAME" == push ]]; then
            args+=(--changed-since "$BEFORE_SHA")
          elif [[ "$EVENT_NAME" == schedule ]]; then
            if [[ "$SCHEDULE" == '47 10 * * 0' ]]; then
              args+=(--frequency weekly --maintenance)
            else
              args+=(--frequency daily)
            fi
          elif [[ -n "$CHANNEL_ID" ]]; then
            args+=(--channel "$CHANNEL_ID")
          fi
          set +e
          python scripts/sync.py "${args[@]}"
          result=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Publicar solamente cambios del catálogo
        env:
          CATALOG_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git add -- channels.json channels/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: actualizar videos de canales'
            # Si alguien publicó mientras se consultaba YouTube, no sobrescribir
            # su curaduría mediante force-push ni un rebase de assets generados.
            git push origin "HEAD:$CATALOG_BRANCH"
          fi
      - name: Informar sincronización incompleta
        if: steps.sync.outputs.result != '0'
        run: |
          echo 'Sincronización incompleta; revisar los reportes en los logs. La siguiente ejecución empieza desde cero.'
          exit 1
