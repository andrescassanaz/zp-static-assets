name: Sincronizar canales

on:
  schedule:
    # UTC: diariamente a las 06:17 de Argentina; mantenimiento los domingos.
    - cron: '17 9 * * *'
    - cron: '47 10 * * 0'
  push:
    branches: [main]
    paths:
      - sources.json
      - catalog/**
      - channels.json
      - channels/**
      - scripts/**
      - .github/workflows/sync.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de sincronización
        type: choice
        options: [daily, maintenance]
        default: daily
      channel:
        description: ID de canal (vacío procesa todos)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: youtube-assets-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Pruebas sin API ni secretos
        run: python -m unittest discover -s tests -v
      - name: Validar configuración y catálogo
        run: python scripts/sync.py --mode validate
      - name: Sincronizar
        id: sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REQUESTED_MODE: ${{ inputs.mode }}
          CHANNEL_ID: ${{ inputs.channel }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          mode="${REQUESTED_MODE:-daily}"
          if [[ "$SCHEDULE" == '47 10 * * 0' ]]; then mode=maintenance; fi
          args=(--mode "$mode")
          if [[ -n "$CHANNEL_ID" ]]; then args+=(--channel "$CHANNEL_ID"); fi
          set +e
          python scripts/sync.py "${args[@]}"
          result=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Guardar cambios y avance parcial
        shell: bash
        run: |
          git add -- channels.json channels/ catalog/ sync-state.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: sincronizar catálogo de YouTube'
            # Si alguien publicó mientras se consultaba YouTube, no sobrescribir
            # su curaduría mediante force-push ni un rebase de assets generados.
            git push origin HEAD:main
          fi
      - name: Informar sincronización incompleta
        if: steps.sync.outputs.result != '0'
        run: |
          echo 'Sincronización incompleta; revisar mensajes seguros y sync-state.json.'
          exit 1
